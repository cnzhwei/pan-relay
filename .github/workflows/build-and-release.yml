name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact_name: wopan-cli-linux-amd64
          - os: linux
            arch: arm64
            artifact_name: wopan-cli-linux-arm64
          - os: darwin
            arch: arm64
            artifact_name: wopan-cli-darwin-arm64
          - os: windows
            arch: amd64
            artifact_name: wopan-cli-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Static Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          OUTPUT_NAME="bin/${{ matrix.artifact_name }}"
          mkdir -p bin
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          go build -trimpath -ldflags="-s -w -X 'main.Version=${VERSION}'" -o "$OUTPUT_NAME" .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bin/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Archives
        run: |
          mkdir -p dist
          cd release-artifacts
          for dir in */; do
            target="${dir%/}"
            if [[ "$target" == *".exe"* ]]; then
              zip "../dist/${target}.zip" "${target}/${target}"
            else
              tar -czf "../dist/${target}.tar.gz" -C "${target}" "${target}"
            fi
          done
          cd ..
          ls -lh dist/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
